services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-db
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  benchmark:
    build: .
    container_name: neo4j-benchmark
    restart: "no"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - TARGET_ROWS=${TARGET_ROWS:-1000000}
      - BATCH_SIZE=${BATCH_SIZE:-10000}
      - FORCE_IMPORT=${FORCE_IMPORT:-false}
