services:
  typesense:
    image: typesense/typesense:26.0
    container_name: typesense-db
    restart: "no"
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=test-api-key
      - TYPESENSE_ENABLE_CORS=true
    ports:
      - "8108:8108"
    volumes:
      - ./data/typesense-data:/data

  benchmark:
    build: .
    container_name: typesense-benchmark
    restart: "no"
    depends_on:
      - typesense
    volumes:
      - ./data:/app/data
    environment:
      - TYPESENSE_API_KEY=test-api-key
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TARGET_ROWS=${TARGET_ROWS:-2000000}
      - BATCH_SIZE=${BATCH_SIZE:-100000}
      - FORCE_IMPORT=${FORCE_IMPORT:-false}
