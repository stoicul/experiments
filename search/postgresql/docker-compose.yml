services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=search_bench
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search_bench"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  benchmark:
    build: .
    container_name: postgres-benchmark
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=search_bench
      - TARGET_ROWS=${TARGET_ROWS:-1000000}
      - BATCH_SIZE=${BATCH_SIZE:-10000}
      - FORCE_IMPORT=${FORCE_IMPORT:-false}
