services:
  benchmark:
    build: .
    container_name: sqlite-benchmark
    restart: "no" 
    volumes:
      - ./data:/app/data
    environment:
      - DB_FILE=data/events.db
      - TARGET_ROWS=${TARGET_ROWS:-1000000}
      - BATCH_SIZE=${BATCH_SIZE:-100000}
      - FORCE_IMPORT=${FORCE_IMPORT:-false}
