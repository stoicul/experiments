services:
  benchmark:
    build: .
    container_name: duckdb-benchmark
    restart: "no" 
    volumes:
      - ./data:/app/data
    environment:
      - DB_FILE=data/events.duckdb
      - TARGET_ROWS=${TARGET_ROWS:-2000000}
      - BATCH_SIZE=${BATCH_SIZE:-100000}
      - FORCE_IMPORT=${FORCE_IMPORT:-false}
