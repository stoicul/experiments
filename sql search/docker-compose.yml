services:
  sql-search:
    build: .
    container_name: sql-search-run
    # Keep the container from restarting automatically since it's a one-off script
    restart: "no" 
    volumes:
      # Map the local data folder to the container's /app/data folder
      - ./data:/app/data
    environment:
      # Optional: Explicitly tell the script where to store the database
      - DB_FILE=data/events.db
    # To run with specific parameters, you can pass arguments via docker-compose run:
    # docker-compose run --rm sql-search --rows 100000 --batch 50000
    # Or you can uncomment the command below to set a default for docker-compose up:
    # command: ["--rows", "100000"]
