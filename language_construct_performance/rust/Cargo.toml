[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"

[[bin]]
name = "plain_obj_naive_fixed_properties"
path = "src/bin/naive/plain_obj_fixed_properties.rs"

[[bin]]
name = "plain_obj_idiomatic_fixed_properties"
path = "src/bin/idiomatic/plain_obj_fixed_properties.rs"

[[bin]]
name = "value_obj_naive_fixed_properties"
path = "src/bin/naive/value_obj_fixed_properties.rs"

[[bin]]
name = "value_obj_idiomatic_fixed_properties"
path = "src/bin/idiomatic/value_obj_fixed_properties.rs"

[[bin]]
name = "plain_obj_naive_variable_properties"
path = "src/bin/naive/plain_obj_variable_properties.rs"

[[bin]]
name = "plain_obj_idiomatic_variable_properties"
path = "src/bin/idiomatic/plain_obj_variable_properties.rs"

[[bin]]
name = "value_obj_naive_variable_properties"
path = "src/bin/naive/value_obj_variable_properties.rs"

[[bin]]
name = "value_obj_idiomatic_variable_properties"
path = "src/bin/idiomatic/value_obj_variable_properties.rs"

[[bin]]
name = "json_encoding_naive"
path = "src/bin/naive/json_encoding.rs"

[[bin]]
name = "json_encoding_idiomatic"
path = "src/bin/idiomatic/json_encoding.rs"

[[bin]]
name = "run_all"
path = "src/bin/run_all.rs"

[[bin]]
name = "update_readme"
path = "src/bin/update_readme.rs"

